[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spurlos"
version = "0.1.0"
description = "Find out which companies hold your personal data and get it deleted under the GDPR, with agents that run on your own machine"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "langgraph>=1.0",
    "tldextract>=5.0",
]

[project.optional-dependencies]
mcp = ["mcp>=2.2,<3"]
pdf = ["pypdf>=4.0"]
dev = [
    "mcp>=2.2,<3",
    "pypdf>=4.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "reportlab>=4.0",
    "ruff>=0.5",
]

[project.scripts]
spurlos = "spurlos.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
spurlos = ["data/*.json.gz", "data/*.json", "web/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
