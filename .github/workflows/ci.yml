name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q
      - run: spurlos --vault demo.db demo --path demo.mbox
      - run: spurlos --vault demo.db census
      - run: spurlos --vault demo.db triage
      - run: spurlos registry show zalando.de
      - run: spurlos --vault demo.db request batch
      - run: spurlos --vault demo.db request list
      - run: spurlos eval-replies
      - run: spurlos --vault demo.db todo
      - run: spurlos --vault demo.db export import brotkorb-shop.example demo-export.zip
      - run: spurlos --vault demo.db map

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t spurlos .
      - run: mkdir -m 777 vault
      - run: docker run --rm -v "$PWD/vault:/data" spurlos demo --path /data/demo.mbox
      - run: docker run --rm -v "$PWD/vault:/data" spurlos census
      - run: docker run --rm -v "$PWD/vault:/data" spurlos export import brotkorb-shop.example /data/demo-export.zip
      - run: docker run --rm -v "$PWD/vault:/data" spurlos map
