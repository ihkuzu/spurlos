[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spurlos"
version = "0.1.0"
description = "Find out which companies hold your personal data and get it deleted under the GDPR, with agents that run on your own machine"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "tldextract>=5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[project.scripts]
spurlos = "spurlos.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
