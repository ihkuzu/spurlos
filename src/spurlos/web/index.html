<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>spurlos</title>
<style>
:root {
  --bg: #f4f1ea; --side: #ece7dc; --card: #fbf9f4; --raise: #ffffff; --ink: #1c1d1a; --soft: #5f625b;
  --faint: #8b8d85; --line: #e1dbcd; --line2: #d5cebd; --accent: #1f5f4f; --accent-ink: #ffffff;
  --green: #2f7d5b; --green-s: #dcebe2; --blue: #3a66a8; --blue-s: #dfe7f3; --amber: #9a6a12; --amber-s: #f3e6c8;
  --red: #b04a2e; --red-s: #f5ddd3; --violet: #6b56a8; --violet-s: #e6e0f3; --teal: #24808a; --teal-s: #d7ecee;
  --serif: "Iowan Old Style", "Charter", "Bitstream Charter", "Sitka Text", Georgia, serif;
  --sans: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, "DejaVu Sans Mono", monospace;
  --shadow: 0 1px 2px rgba(40, 35, 20, .05), 0 6px 24px rgba(40, 35, 20, .06);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #151614; --side: #1b1c19; --card: #1f201d; --raise: #262723; --ink: #ecebe5; --soft: #a4a69d;
    --faint: #7b7d75; --line: #2e302b; --line2: #3a3c36; --accent: #6cc2a6; --accent-ink: #10201b;
    --green: #74c79e; --green-s: #20352b; --blue: #8fb0e6; --blue-s: #1f2b3d; --amber: #e2b45c; --amber-s: #3a3020;
    --red: #ef8f74; --red-s: #3d231b; --violet: #b6a5ea; --violet-s: #2c2640; --teal: #74c6cf; --teal-s: #1b3336;
    --shadow: none;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14.5px/1.55 var(--sans); -webkit-font-smoothing: antialiased; }
.app { display: grid; grid-template-columns: 248px 1fr; min-height: 100vh; }
.side { background: var(--side); border-right: 1px solid var(--line); padding: 18px 12px; display: flex; flex-direction: column;
  position: sticky; top: 0; height: 100vh; }
.brand { display: flex; gap: 10px; align-items: center; padding: 2px 8px 18px; }
.mark { width: 34px; height: 34px; border-radius: 9px; background: var(--ink); color: var(--bg); display: grid; place-items: center;
  font: 600 20px/1 var(--serif); flex: none; }
.brand b { display: block; font: 600 20px/1.1 var(--serif); letter-spacing: .01em; }
.brand small { color: var(--soft); font-size: 12px; }
.navlabel { color: var(--faint); font-size: 11.5px; letter-spacing: .04em; padding: 14px 10px 6px; }
#tabs button { display: flex; width: 100%; align-items: center; gap: 10px; padding: 8px 10px; margin: 1px 0; border: 0; border-radius: 8px;
  background: none; color: var(--ink); font: 500 14px var(--sans); cursor: pointer; text-align: left; }
#tabs button:hover { background: rgba(120, 110, 80, .08); }
#tabs button.on { background: var(--raise); box-shadow: var(--shadow); }
#tabs svg { width: 17px; height: 17px; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; flex: none; opacity: .8; }
#tabs .count { margin-left: auto; font-size: 12px; color: var(--soft); background: var(--bg); border-radius: 99px; padding: 0 8px; }
.side .spacer { flex: 1; }
.safe { margin: 10px 4px; padding: 10px 12px; border: 1px solid var(--line2); border-radius: 10px; font-size: 12px; color: var(--soft); }
.safe b { display: flex; align-items: center; gap: 6px; color: var(--ink); font-weight: 600; margin-bottom: 2px; }
.safe b::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--green); }
.me { display: flex; gap: 10px; align-items: center; padding: 12px 8px 0; border-top: 1px solid var(--line); margin-top: 6px; }
.avatar { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; font-weight: 600; font-size: 12.5px;
  background: var(--ink); color: var(--bg); flex: none; }
.me div { min-width: 0; } .me b { display: block; font-size: 13px; } .me span { display: block; color: var(--soft); font-size: 12px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.main { padding: 34px 44px 70px; max-width: 1180px; width: 100%; }
.ph { display: flex; gap: 20px; align-items: flex-end; justify-content: space-between; margin-bottom: 26px; flex-wrap: wrap; }
.crumb { color: var(--soft); font-size: 13px; margin-bottom: 4px; }
h1 { font: 400 38px/1.12 var(--serif); margin: 0; letter-spacing: -.01em; }
.lede { color: var(--soft); max-width: 640px; margin: 10px 0 0; font-size: 15px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 22px 24px; box-shadow: var(--shadow); margin-bottom: 18px; }
.card h2 { font: 400 22px/1.2 var(--serif); margin: 0; }
.card .sub { color: var(--soft); margin: 4px 0 0; font-size: 13.5px; }
.cardhead { display: flex; justify-content: space-between; gap: 20px; align-items: flex-start; flex-wrap: wrap; margin-bottom: 20px; }
.stats { display: flex; gap: 30px; }
.stat b { display: block; font: 400 30px/1 var(--serif); }
.stat span { color: var(--soft); font-size: 12.5px; }
.grid2 { display: grid; grid-template-columns: 1.25fr 1fr; gap: 18px; }
.flow { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
.stage .n { font: 400 28px/1 var(--serif); margin: 4px 0 2px; }
.stage .t { font-weight: 600; font-size: 13.5px; }
.stage .c { color: var(--soft); font-size: 12.5px; min-height: 19px; }
.stage .bar { height: 10px; border-radius: 99px; background: var(--bg); margin-top: 10px; overflow: hidden; }
.stage .bar i { display: block; height: 100%; border-radius: 99px; }
.todo { list-style: none; margin: 0; padding: 0; }
.todo li { display: flex; gap: 12px; align-items: flex-start; padding: 12px 0; border-top: 1px solid var(--line); }
.todo li:first-child { border-top: 0; padding-top: 0; }
.dot { width: 9px; height: 9px; border-radius: 50%; margin-top: 7px; flex: none; background: var(--amber); }
.todo b { display: block; font-weight: 600; }
code, .ref { font: 12px var(--mono); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 2px 7px; white-space: nowrap; }
.cmd { display: inline-flex; align-items: center; gap: 6px; margin-top: 5px; }
.copy { border: 0; background: none; color: var(--soft); cursor: pointer; font-size: 12px; padding: 2px 4px; }
.copy:hover { color: var(--ink); }
.kinds { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.kind { border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; background: var(--raise); }
.kind b { font: 400 22px/1 var(--serif); display: block; }
.kind span { color: var(--soft); font-size: 12px; }
.kind.sens { border-color: transparent; background: var(--red-s); } .kind.sens span { color: var(--red); }
.toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
.seg { display: inline-flex; background: var(--side); border: 1px solid var(--line); border-radius: 10px; padding: 3px; }
.seg button { border: 0; background: none; padding: 5px 12px; border-radius: 7px; font: 500 13px var(--sans); color: var(--soft); cursor: pointer; }
.seg button.on { background: var(--raise); color: var(--ink); box-shadow: var(--shadow); }
input, select { font: inherit; color: var(--ink); background: var(--raise); border: 1px solid var(--line2); border-radius: 9px; padding: 7px 12px; }
input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
.search { min-width: 260px; }
.tbl { width: 100%; border-collapse: separate; border-spacing: 0; background: var(--card); border: 1px solid var(--line);
  border-radius: 14px; overflow: hidden; box-shadow: var(--shadow); }
.tbl th { text-align: left; font-weight: 500; font-size: 12px; color: var(--soft); padding: 11px 16px; border-bottom: 1px solid var(--line); background: var(--side); }
.tbl td { padding: 13px 16px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl tr.click { cursor: pointer; } .tbl tr.click:hover td { background: var(--raise); }
.who2 { display: flex; gap: 12px; align-items: center; }
.ini { width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; font-weight: 600; font-size: 13px; flex: none; }
.muted { color: var(--soft); font-size: 12.5px; }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 500; padding: 2px 10px; border-radius: 99px;
  white-space: nowrap; background: var(--bg); color: var(--soft); }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.p-draft, .p-medium, .p-waiting_on_you, .p-acknowledged, .p-extension { background: var(--amber-s); color: var(--amber); }
.p-sent, .p-auto_reply { background: var(--blue-s); color: var(--blue); }
.p-answered, .p-data_provided { background: var(--teal-s); color: var(--teal); }
.p-done, .p-confirmed, .p-no_data, .p-low { background: var(--green-s); color: var(--green); }
.p-refused, .p-high, .p-late, .p-id_required { background: var(--red-s); color: var(--red); }
.p-complained { background: var(--violet-s); color: var(--violet); }
.btn { display: inline-flex; align-items: center; gap: 6px; font: 500 13px var(--sans); padding: 7px 13px; border-radius: 9px; cursor: pointer;
  border: 1px solid var(--ink); background: var(--ink); color: var(--bg); text-decoration: none; white-space: nowrap; }
.btn.ghost { background: var(--raise); color: var(--ink); border-color: var(--line2); }
.btn:disabled { opacity: .4; cursor: default; }
.due { min-width: 150px; }
.due .track { height: 6px; border-radius: 99px; background: var(--bg); overflow: hidden; margin-top: 6px; }
.due .track i { display: block; height: 100%; border-radius: 99px; background: var(--blue); }
.due.late .track i { background: var(--red); }
.empty { padding: 40px; text-align: center; color: var(--soft); background: var(--card); border: 1px dashed var(--line2); border-radius: 14px; }
.heat { border-collapse: separate; border-spacing: 6px; width: 100%; margin: -6px; }
.heat th { font-weight: 500; font-size: 12px; color: var(--soft); text-align: center; padding: 0 2px 4px; }
.heat th:first-child { text-align: left; }
.heat td { text-align: center; border-radius: 9px; height: 42px; font: 400 18px var(--serif); background: var(--bg); color: var(--faint); }
.heat td:first-child { text-align: left; background: none; font: 500 14px var(--sans); color: var(--ink); padding-right: 10px; }
.heat td.on { background: var(--green-s); color: var(--green); }
.heat td.on.sens { background: var(--red-s); color: var(--red); }
.heat tr.click { cursor: pointer; } .heat tr.sel td:first-child { text-decoration: underline; text-underline-offset: 4px; }
.reply { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px; margin-bottom: 12px; box-shadow: var(--shadow); }
.reply.click { cursor: pointer; } .reply.click:hover { border-color: var(--line2); }
.reply .top { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 8px; }
.reply .sum { font: 400 17px/1.4 var(--serif); }
.reply .next { margin-top: 8px; font-size: 13px; color: var(--soft); }
.reply .next b { color: var(--ink); font-weight: 600; }
.scrim { position: fixed; inset: 0; background: rgba(20, 18, 12, .28); opacity: 0; pointer-events: none; transition: opacity .2s; }
.scrim.open { opacity: 1; pointer-events: auto; }
.drawer { position: fixed; inset: 0 0 0 auto; width: min(720px, 100%); background: var(--bg); border-left: 1px solid var(--line);
  overflow: auto; transform: translateX(100%); transition: transform .22s ease; }
.drawer.open { transform: none; box-shadow: -18px 0 50px rgba(0, 0, 0, .14); }
.dhead { padding: 26px 30px 18px; border-bottom: 1px solid var(--line); background: var(--side); }
.dhead h1 { font-size: 30px; }
.meta { display: flex; gap: 18px; flex-wrap: wrap; color: var(--soft); font-size: 13px; margin: 10px 0 14px; }
.acts { display: flex; gap: 8px; flex-wrap: wrap; }
.dbody { padding: 24px 30px 40px; }
.dbody h3 { font: 400 19px var(--serif); margin: 22px 0 10px; }
.letter { background: var(--raise); border: 1px solid var(--line); border-radius: 12px; padding: 22px 26px; box-shadow: var(--shadow); }
.letter .subj { font-weight: 600; margin-bottom: 10px; }
.letter pre { margin: 0; white-space: pre-wrap; font: 13.5px/1.6 var(--sans); max-height: 380px; overflow: auto; }
.note { background: var(--green-s); border-radius: 10px; padding: 11px 14px; font-size: 13px; margin-top: 14px; }
.close { position: absolute; top: 18px; right: 20px; width: 34px; height: 34px; border-radius: 9px; border: 1px solid var(--line2);
  background: var(--raise); color: var(--soft); font-size: 18px; cursor: pointer; }
.reply pre { white-space: pre-wrap; font: 13px/1.55 var(--sans); color: var(--soft); background: var(--bg); border-radius: 9px; padding: 10px 12px; margin: 10px 0 0; max-height: 200px; overflow: auto; }
.fix { display: flex; gap: 8px; align-items: center; margin-top: 10px; font-size: 13px; color: var(--soft); }
#toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg);
  padding: 10px 16px; border-radius: 10px; font-size: 13.5px; opacity: 0; transition: opacity .2s; pointer-events: none; }
#toast.show { opacity: 1; }
.foot { color: var(--faint); font-size: 12.5px; margin-top: 26px; }
@media (max-width: 900px) {
  .app { grid-template-columns: 1fr; }
  .side { position: static; height: auto; flex-direction: row; flex-wrap: wrap; align-items: center; padding: 10px 12px; }
  .brand { padding: 0 10px 0 4px; } .navlabel, .spacer, .safe, .me { display: none; }
  #tabs { display: flex; gap: 2px; overflow-x: auto; width: 100%; } #tabs button { width: auto; white-space: nowrap; }
  .main { padding: 24px 16px 60px; } .grid2, .flow { grid-template-columns: 1fr 1fr; } .hide-s { display: none; } .search { min-width: 0; width: 100%; }
  h1 { font-size: 30px; }
}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><div class="mark">s</div><div><b>spurlos</b><small>your data, on your machine</small></div></div>
    <nav id="tabs">
      <button data-tab="overview" class="on"><svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Overview</button>
      <div class="navlabel">Your data</div>
      <button data-tab="orgs"><svg viewBox="0 0 24 24"><path d="M4 21V5a1 1 0 0 1 1-1h9a1 1 0 0 1 1 1v16M15 9h4a1 1 0 0 1 1 1v11M8 8h3M8 12h3M8 16h3M3 21h18"/></svg>Organisations<span class="count" id="n-orgs"></span></button>
      <button data-tab="known"><svg viewBox="0 0 24 24"><ellipse cx="12" cy="5.5" rx="7.5" ry="2.5"/><path d="M4.5 5.5v6c0 1.4 3.4 2.5 7.5 2.5s7.5-1.1 7.5-2.5v-6M4.5 11.5v6c0 1.4 3.4 2.5 7.5 2.5s7.5-1.1 7.5-2.5v-6"/></svg>What they know<span class="count" id="n-known"></span></button>
      <div class="navlabel">Your rights</div>
      <button data-tab="requests"><svg viewBox="0 0 24 24"><path d="M21 3 10 14M21 3l-7 18-4-7-7-4z"/></svg>Requests<span class="count" id="n-req"></span></button>
      <button data-tab="replies"><svg viewBox="0 0 24 24"><path d="M3 13h5l2 3h4l2-3h5M5 5h14l2 8v6a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1v-6z"/></svg>Replies<span class="count" id="n-rep"></span></button>
    </nav>
    <div class="spacer"></div>
    <div class="safe"><b>Local only</b>Served on 127.0.0.1. This page cannot send mail; sending stays in the command line.</div>
    <div class="me"><div class="avatar" id="ini">?</div><div><b id="me-name">No profile yet</b><span id="me-mail">spurlos profile --name …</span></div></div>
  </aside>
  <main class="main"><div id="view"></div></main>
</div>
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer"></aside>
<div id="toast"></div>
<script>
const TOKEN = "__TOKEN__";
let view = document.getElementById("view");
const drawer = document.getElementById("drawer");
const scrim = document.getElementById("scrim");
let labels = [];

const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) =>
  ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const words = (s) => esc(String(s ?? "").replaceAll("_", " "));
const pill = (key, text) => `<span class="pill p-${esc(key)}">${words(text ?? key)}</span>`;
const SENS = new Set(["payment", "health", "location", "profiling"]);
const TONES = [["#dcebe2", "#2f7d5b"], ["#dfe7f3", "#3a66a8"], ["#f3e6c8", "#9a6a12"], ["#e6e0f3", "#6b56a8"], ["#d7ecee", "#24808a"], ["#f5ddd3", "#b04a2e"]];
const tone = (s) => TONES[[...s].reduce((a, c) => a + c.charCodeAt(0), 0) % TONES.length];
const initials = (name) => (name || "?").split(/[\s.@-]+/).filter(Boolean).slice(0, 2).map((w) => w[0].toUpperCase()).join("");

async function api(path, body) {
  const opts = {headers: {"X-Spurlos-Token": TOKEN}};
  if (body) {
    opts.method = "POST";
    opts.headers["Content-Type"] = "application/json";
    opts.body = JSON.stringify(body);
  }
  const res = await fetch(path, opts);
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || res.statusText);
  return data;
}

function toast(text) {
  const t = document.getElementById("toast");
  t.textContent = text; t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 2600);
}

async function act(path, body, okText) {
  try { const r = await api(path, body); toast(okText(r)); return r; }
  catch (e) { toast(e.message); return null; }
}

function head(title, lede, crumb = "", actions = "") {
  return `<header class="ph"><div>${crumb ? `<div class="crumb">${crumb}</div>` : ""}<h1>${title}</h1>${lede ? `<p class="lede">${lede}</p>` : ""}</div><div class="acts">${actions}</div></header>`;
}

function due(r) {
  if (r.status !== "sent" || r.days_left === null) return pill(r.status);
  const left = r.days_left;
  const used = Math.min(100, Math.max(4, (30 - left) / 30 * 100));
  return `<div class="due ${left < 0 ? "late" : ""}"><span class="muted" style="color:var(--${left < 0 ? "red" : "ink"})">${left < 0 ? `overdue by ${-left} days` : `${left} days left`}</span>
    <div class="track"><i style="width:${used}%"></i></div></div>`;
}

const isMain = (r) => !["reminder", "complaint"].includes(r.kind);
const SAYS = {
  confirmed: "They carried out the request and deleted your data.", data_provided: "They sent you a copy of your data.",
  no_data: "They say they hold no data about you.", id_required: "They want more information before they act.",
  extension: "They need more time and extended the deadline.", refused: "They refuse the request.",
  acknowledged: "They received the request; a real answer will follow.", auto_reply: "An automatic reply, not a real answer.",
};

async function overview() {
  const [o, reqs, held] = await Promise.all([api("/api/overview"), api("/api/requests"), api("/api/holdings")]);
  labels = o.labels;
  const p = o.profile;
  document.getElementById("ini").textContent = initials(p.name);
  document.getElementById("me-name").textContent = p.name || "No profile yet";
  document.getElementById("me-mail").textContent = p.email || "spurlos profile --name …";
  document.getElementById("n-orgs").textContent = o.organisations || "";
  const main = reqs.filter(isMain);
  document.getElementById("n-req").textContent = main.length || "";
  const orgsHeld = [...new Set(held.rows.map((r) => r.org))];
  document.getElementById("n-known").textContent = orgsHeld.length || "";
  const hour = new Date().getHours();
  const hello = hour < 12 ? "Good morning" : hour < 18 ? "Good afternoon" : "Good evening";
  const first = (p.name || "").split(" ")[0];
  const sent = main.filter((r) => r.status !== "draft").length;
  const heard = main.filter((r) => !["draft", "sent"].includes(r.status)).length;
  const done = main.filter((r) => r.status === "done").length;
  const pct = (a, b) => (b ? Math.round(a / b * 100) : 0);
  const stage = (t, n, c, color, of) => `<div class="stage"><div class="t">${t}</div><div class="n">${n}</div><div class="c">${c}</div>
    <div class="bar"><i style="width:${of ? Math.max(4, n / of * 100) : 0}%;background:var(--${color})"></i></div></div>`;
  const kinds = {};
  held.rows.forEach((r) => { kinds[r.category] = (kinds[r.category] || 0) + 1; });
  view.innerHTML = head(`${hello}${first ? `, ${esc(first)}` : ""}`,
    `${o.organisations} organisations have your email address and ${o.dormant} of them have not written for over two years. You have asked ${sent} of them about your data and ${heard} have answered.`) + `
    <section class="card">
      <div class="cardhead"><div><h2>Your requests</h2><p class="sub">How far each request has come under the GDPR's one-month deadline.</p></div>
        <div class="stats"><div class="stat"><b>${sent}</b><span>sent</span></div><div class="stat"><b>${pct(heard, sent)}%</b><span>heard back</span></div><div class="stat"><b>${done}</b><span>done</span></div></div></div>
      <div class="flow">
        ${stage("Drafted", main.length, "everything you prepared", "faint", main.length)}
        ${stage("Sent", sent, sent ? `${pct(sent, main.length)}% of drafted` : "nothing sent yet", "blue", main.length)}
        ${stage("Answered", heard, heard ? `${pct(heard, sent)}% of sent` : "no answers yet", "teal", main.length)}
        ${stage("Done", done, done ? "deleted, or nothing held" : "none yet", "green", main.length)}
      </div>
    </section>
    <div class="grid2">
      <section class="card"><div class="cardhead" style="margin-bottom:14px"><div><h2>To do</h2><p class="sub">What needs you now.</p></div></div>
        ${o.todo.length ? `<ul class="todo">${o.todo.map((t) => `<li><span class="dot"></span><div><b>${esc(t.what)}</b>
          <span class="cmd"><code>${esc(t.command)}</code><button class="copy" data-copy="${esc(t.command)}">copy</button></span></div></li>`).join("")}</ul>`
          : `<p class="muted">Nothing right now. New answers show up here once you import them.</p>`}
      </section>
      <section class="card"><div class="cardhead" style="margin-bottom:14px"><div><h2>What they know</h2><p class="sub">${orgsHeld.length ? `From the data ${orgsHeld.length} ${orgsHeld.length === 1 ? "company" : "companies"} sent back.` : "Nothing read yet."}</p></div></div>
        ${orgsHeld.length ? `<div class="kinds">${Object.entries(kinds).sort((a, b) => b[1] - a[1]).map(([k, n]) =>
          `<div class="kind ${SENS.has(k) ? "sens" : ""}"><b>${n}</b><span>${esc(held.labels[k] || k)}</span></div>`).join("")}</div>`
          : `<p class="muted">When a company answers an access request with your data, run <code>spurlos export import DOMAIN FILE</code>.</p>`}
      </section>
    </div>
    <p class="foot">Read from ${o.messages} message headers. Mail bodies are never downloaded, and nothing on this page leaves your computer.</p>`;
  view.querySelectorAll("[data-copy]").forEach((b) => b.onclick = async () => {
    try { await navigator.clipboard.writeText(b.dataset.copy); toast("Copied"); } catch { toast(b.dataset.copy); }
  });
}

async function orgs() {
  const items = await api("/api/triage");
  const high = items.filter((i) => i.priority === "high").length;
  view.innerHTML = head("Organisations", `Everyone who has written to your address, with what spurlos suggests. ${high} are worth acting on first.`) + `
    <div class="toolbar">
      <div class="seg" id="pri"><button class="on" data-p="">All</button><button data-p="high">High</button><button data-p="medium">Medium</button><button data-p="low">Low</button></div>
      <input id="q" class="search" placeholder="Search organisations">
    </div><div id="list"></div>`;
  const kinds = {"erasure": ["erasure"], "access": ["access"], "access+objection": ["access", "objection"]};
  let pri = "";
  const draw = () => {
    const q = document.getElementById("q").value.toLowerCase();
    const rows = items.filter((i) => (!pri || i.priority === pri) && (i.name + i.domain).toLowerCase().includes(q));
    document.getElementById("list").innerHTML = rows.length ? `<table class="tbl">
      <tr><th>Organisation</th><th class="hide-s">Category</th><th>Suggestion</th><th class="hide-s">Last mail</th><th></th></tr>
      ${rows.map((i) => { const [bg, fg] = tone(i.domain); return `<tr>
        <td><div class="who2"><div class="ini" style="background:${bg};color:${fg}">${esc(initials(i.name))}</div>
          <div><b>${esc(i.name)}</b><div class="muted">${esc(i.domain)} · ${i.messages} mails</div></div></div></td>
        <td class="hide-s muted">${esc(i.category)}</td>
        <td>${pill(i.priority)} <b style="font-weight:600;margin-left:4px">${esc(i.action)}</b><div class="muted" style="margin-top:3px">${esc(i.reason)}</div></td>
        <td class="hide-s muted" style="white-space:nowrap">${esc((i.last_seen || "").slice(0, 10))}${i.dormant ? `<div style="color:var(--amber)">silent 2+ years</div>` : ""}</td>
        <td style="text-align:right">${(kinds[i.action] || []).map((k) => {
          const has = i.requests.find((r) => r.kind === k);
          if (has) return pill(has.status, `${k} ${has.status}`);
          return `<button class="btn ghost" data-domain="${esc(i.domain)}" data-kind="${k}" ${i.contact ? "" : "disabled title='no contact yet: spurlos contact DOMAIN --email ...'"}>Draft ${k}</button>`;
        }).join(" ")}</td></tr>`; }).join("")}</table>` : `<div class="empty">No organisations match.</div>`;
  };
  view.querySelector("#q").addEventListener("input", draw);
  view.querySelector("#pri").addEventListener("click", (e) => {
    const b = e.target.closest("button[data-p]"); if (!b) return;
    pri = b.dataset.p; view.querySelectorAll("#pri button").forEach((x) => x.classList.toggle("on", x === b)); draw();
  });
  view.addEventListener("click", async (e) => {
    const b = e.target.closest("button[data-kind]");
    if (!b) return;
    const r = await act("/api/draft", {domain: b.dataset.domain, kind: b.dataset.kind}, (x) => `Draft ${x.id} saved`);
    if (r) { b.disabled = true; b.textContent = r.id; }
  });
  draw();
}

async function requests() {
  const rows = await api("/api/requests");
  const late = rows.filter((r) => r.status === "sent" && r.days_left < 0).length;
  view.innerHTML = head("Requests", rows.length ? `Every letter you prepared and where it stands. ${late ? `${late} ${late === 1 ? "is" : "are"} past the deadline.` : "None is past the deadline."}` : "") + (rows.length ? `<table class="tbl">
    <tr><th>Reference</th><th>Organisation</th><th>Status</th><th class="hide-s">Deadline</th><th class="hide-s">Replies</th></tr>
    ${rows.map((r) => `<tr class="click" data-id="${esc(r.id)}">
      <td><span class="ref">${esc(r.id)}</span></td>
      <td><b>${esc(r.org)}</b><div class="muted">${esc(r.kind)}${r.parent ? ` for ${esc(r.parent)}` : ""} · ${esc(r.transport)}</div></td>
      <td>${r.status === "sent" && r.days_left < 0 ? pill("late", "overdue") : pill(r.status)}</td>
      <td class="hide-s">${r.status === "sent" ? due(r) : `<span class="muted">${r.sent ? "sent " + esc(r.sent.slice(0, 10)) : "not sent yet"}</span>`}</td>
      <td class="hide-s muted">${r.replies || "–"}</td></tr>`).join("")}
  </table>` : `<div class="empty">No requests yet. Draft one from the Organisations page.</div>`);
  view.querySelectorAll("tr.click").forEach((tr) => tr.addEventListener("click", () => openRequest(tr.dataset.id)));
}

function closeDrawer() { drawer.classList.remove("open"); scrim.classList.remove("open"); }
scrim.onclick = closeDrawer;

async function openRequest(id) {
  const r = await api(`/api/request/${encodeURIComponent(id)}`);
  const late = r.status === "sent" && r.due && new Date(r.due) < new Date();
  const main = isMain(r);
  drawer.innerHTML = `
    <div class="dhead"><button class="close" aria-label="Close">×</button>
      <div class="crumb">Requests / <span class="ref">${esc(r.id)}</span></div>
      <h1>${esc(r.kind[0].toUpperCase() + r.kind.slice(1))} · ${esc(r.org)}</h1>
      <div class="meta"><span>${late ? pill("late", "overdue") : pill(r.status)}</span><span>to ${esc(r.recipient)}</span><span>by ${esc(r.transport)}</span>
        ${r.sent ? `<span>sent ${esc(r.sent.slice(0, 10))}</span>` : ""}${r.due ? `<span>answer due ${esc(r.due)}</span>` : ""}</div>
      <div class="acts">
        ${late && main ? `<button class="btn" data-do="remind">Draft reminder</button>` : ""}
        ${(late || r.status === "refused") && main ? `<button class="btn ghost" data-do="complain">Draft complaint</button>` : ""}
        ${r.status === "draft" ? `<button class="btn" data-do="mark-sent">I sent it</button>` : ""}
        ${r.transport === "email" ? `<a class="btn ghost" href="#" data-export="${esc(r.id)}">Download .eml</a>` : ""}
        ${r.status === "draft" ? `<button class="btn ghost" data-do="delete">Delete draft</button>` : ""}
      </div>
    </div>
    <div class="dbody">
      ${r.status === "draft" && r.transport === "email" ? `<div class="note" style="margin:0 0 16px">Send it with <code>spurlos request send ${esc(r.id)}</code>, or open the .eml in your mail program and press “I sent it”.</div>` : ""}
      <div class="letter"><div class="subj">${esc(r.subject)}</div><pre>${esc(r.body)}</pre></div>
      <h3>Replies</h3>
      ${r.replies.length ? r.replies.map((x) => `
        <div class="reply"><div class="top">${pill(x.label)}<span class="muted">${esc((x.date || "").slice(0, 10))} · ${esc(x.sender)} · labelled by ${esc(x.source)}</span></div>
          ${x.summary ? `<div class="sum">${esc(x.summary)}</div>` : ""}
          <div class="next"><b>Next:</b> ${esc(x.next_step || "–")}</div>
          <pre>${esc(x.body)}</pre>
          <div class="fix">Wrong label? <select data-key="${esc(x.key)}">${labels.map((l) => `<option ${l === x.label ? "selected" : ""}>${l}</option>`).join("")}</select></div>
        </div>`).join("") : `<p class="muted">No reply yet.</p>`}
    </div>`;
  drawer.classList.add("open"); scrim.classList.add("open");
  drawer.querySelector(".close").onclick = closeDrawer;
  drawer.querySelectorAll("[data-do]").forEach((b) => b.onclick = async () => {
    const what = b.dataset.do;
    const body = {id: r.id};
    if (what === "complain" && r.status === "refused") body.why = prompt("Why does their reason not hold? (optional)") || "";
    const done = await act(`/api/${what}`, body, (x) => x.id ? `Draft ${x.id} saved` : x.due ? `Answer due by ${x.due}` : "Done");
    if (done) { closeDrawer(); show("requests"); }
  });
  drawer.querySelectorAll("[data-export]").forEach((a) => a.onclick = async (e) => {
    e.preventDefault();
    const res = await fetch(`/api/export/${encodeURIComponent(a.dataset.export)}`, {headers: {"X-Spurlos-Token": TOKEN}});
    const url = URL.createObjectURL(await res.blob());
    const link = document.createElement("a");
    link.href = url; link.download = `${a.dataset.export}.eml`; link.click();
    URL.revokeObjectURL(url);
  });
  drawer.querySelectorAll("select[data-key]").forEach((s) => s.onchange = async () => {
    const done = await act("/api/relabel", {key: s.dataset.key, label: s.value}, (x) => `Saved. Next: ${x.next || "–"}`);
    if (done) openRequest(r.id);
  });
}

async function replies() {
  const rows = await api("/api/replies");
  document.getElementById("n-rep").textContent = rows.length || "";
  view.innerHTML = head("Replies", rows.length ? "What companies answered, and what the reply agent made of it. Open one to correct the label." : "") + (rows.length ? rows.map((x) => `
    <div class="reply click" data-id="${esc(x.request_id || "")}"><div class="top">${pill(x.label || "unknown")}
      <b>${esc(x.sender)}</b><span class="muted">${esc((x.date || "").slice(0, 10))}</span>
      ${x.request_id ? `<span class="ref" style="margin-left:auto">${esc(x.request_id)}</span>` : ""}</div>
      <div class="sum">${esc(x.summary || SAYS[x.label] || x.subject)}</div>
      <div class="muted" style="margin-top:2px">${esc(x.subject)}</div>
      <div class="next"><b>Next:</b> ${esc(x.next_step || "–")} <span class="muted">· labelled by ${esc(x.source || "")}</span></div></div>`).join("")
    : `<div class="empty">No replies yet. Run <code>spurlos replies fetch ...</code> or <code>spurlos replies import ...</code>.</div>`);
  view.querySelectorAll(".reply.click").forEach((d) => d.addEventListener("click", () => d.dataset.id && openRequest(d.dataset.id)));
}

async function known() {
  const {labels: names, rows} = await api("/api/holdings");
  if (!rows.length) {
    view.innerHTML = head("What they know", "") + `<div class="empty">No data exports read yet. When a company sends you your data, run <code>spurlos export import DOMAIN FILE</code>.</div>`;
    return;
  }
  const cats = Object.keys(names).filter((c) => rows.some((r) => r.category === c));
  const orgs = [...new Set(rows.map((r) => r.org))];
  const count = (o, c) => rows.filter((r) => r.org === o && r.category === c).length;
  view.innerHTML = head("What they know", "What each company's data export contained, sorted into kinds of data. Only field names and masked examples are kept; the export itself is never stored.") + `
    <section class="card"><div class="cardhead"><div><h2>By company</h2><p class="sub">Fields per kind of data. Red marks bank, health, location and profiling data.</p></div></div>
      <table class="heat"><tr><th></th>${cats.map((c) => `<th title="${esc(names[c])}">${esc(c)}</th>`).join("")}</tr>
      ${orgs.map((o) => `<tr class="click" data-org="${esc(o)}"><td>${esc(o)}</td>${cats.map((c) => {
        const n = count(o, c);
        return `<td class="${n ? "on" : ""}${n && SENS.has(c) ? " sens" : ""}">${n || "·"}</td>`;
      }).join("")}</tr>`).join("")}</table></section>
    <div id="fields"></div>`;
  const fields = (o) => {
    view.querySelectorAll(".heat tr.click").forEach((tr) => tr.classList.toggle("sel", tr.dataset.org === o));
    document.getElementById("fields").innerHTML = `<table class="tbl">
      <tr><th>${esc(o)}</th><th>Field</th><th class="hide-s">Count</th><th>Example</th></tr>
      ${rows.filter((r) => r.org === o).map((r) => `<tr><td>${pill(SENS.has(r.category) ? "high" : "sent", names[r.category] || r.category)}</td>
        <td><code>${esc(r.field)}</code></td><td class="hide-s muted">${r.count}</td><td class="muted" style="font-family:var(--mono);font-size:12.5px">${esc(r.example)}</td></tr>`).join("")}</table>`;
  };
  view.querySelectorAll(".heat tr.click").forEach((tr) => tr.addEventListener("click", () => fields(tr.dataset.org)));
  fields(orgs[0]);
}

const pages = {overview, orgs, requests, replies, known};
async function show(tab) {
  document.querySelectorAll("#tabs button").forEach((b) => b.classList.toggle("on", b.dataset.tab === tab));
  const fresh = view.cloneNode(false);
  view.replaceWith(fresh);
  view = fresh;
  try { await pages[tab](); } catch (e) { fresh.innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
  window.scrollTo(0, 0);
}
document.getElementById("tabs").addEventListener("click", (e) => {
  const b = e.target.closest("button[data-tab]");
  if (b) { closeDrawer(); show(b.dataset.tab); }
});
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeDrawer(); });
api("/api/replies").then((r) => { document.getElementById("n-rep").textContent = r.length || ""; }).catch(() => {});
show("overview");
</script>
</body>
</html>
