<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>spurlos</title>
<style>
:root {
  --paper: #f6f4ef; --card: #fffdf9; --ink: #1d2320; --soft: #5d655f; --line: #e2ddd2;
  --accent: #1f6f5c; --accent-soft: #dcece6; --warn: #a8461f; --warn-soft: #f6e1d6;
  --amber: #8a6416; --amber-soft: #f3e8cc; --mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --paper: #151917; --card: #1c211f; --ink: #e8ebe7; --soft: #9aa39d; --line: #2c3330;
    --accent: #5fc0a3; --accent-soft: #1f3a32; --warn: #f08c62; --warn-soft: #3d2419;
    --amber: #e1b65a; --amber-soft: #3a3019;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--paper); color: var(--ink);
  font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
header { display: flex; align-items: baseline; gap: 16px; padding: 22px 32px 0; flex-wrap: wrap; }
.brand { font: 600 22px/1 ui-serif, Georgia, serif; letter-spacing: .02em; }
.brand span { color: var(--soft); font: 13px system-ui; letter-spacing: 0; margin-left: 8px; }
.who { margin-left: auto; color: var(--soft); font-size: 13px; }
nav { display: flex; gap: 4px; padding: 18px 32px 0; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
nav button { background: none; border: 0; border-bottom: 2px solid transparent; padding: 8px 12px;
  color: var(--soft); font: inherit; cursor: pointer; }
nav button.on { color: var(--ink); border-color: var(--accent); }
main { padding: 24px 32px 60px; max-width: 1200px; }
.hero { display: grid; grid-template-columns: minmax(260px, 1.3fr) repeat(3, minmax(140px, 1fr));
  gap: 14px; margin-bottom: 26px; }
.tile { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; }
.tile .n { font: 600 34px/1.1 ui-serif, Georgia, serif; }
.tile.big .n { font-size: 54px; color: var(--accent); }
.tile .t { color: var(--soft); font-size: 13px; margin-top: 4px; }
h2 { font: 600 16px/1.3 system-ui; margin: 26px 0 10px; }
.todo { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
.todo li { background: var(--card); border: 1px solid var(--line); border-left: 3px solid var(--amber);
  border-radius: 8px; padding: 10px 14px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
code { font: 12.5px var(--mono); background: var(--paper); border: 1px solid var(--line);
  border-radius: 5px; padding: 2px 6px; }
.bar { display: flex; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
input, select, textarea { font: inherit; color: var(--ink); background: var(--card);
  border: 1px solid var(--line); border-radius: 7px; padding: 6px 10px; }
table { width: 100%; border-collapse: collapse; background: var(--card); border: 1px solid var(--line);
  border-radius: 10px; overflow: hidden; }
th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-weight: 600; font-size: 12px; color: var(--soft); text-transform: uppercase; letter-spacing: .04em; }
tr:last-child td { border-bottom: 0; }
tr.click { cursor: pointer; } tr.click:hover td { background: var(--paper); }
.muted { color: var(--soft); font-size: 13px; }
.chip { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 99px;
  background: var(--paper); border: 1px solid var(--line); white-space: nowrap; }
.chip.high, .chip.late, .chip.refused { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.chip.medium, .chip.waiting_on_you, .chip.draft { background: var(--amber-soft); color: var(--amber); border-color: transparent; }
.chip.done, .chip.answered, .chip.ok { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
button.act { white-space: nowrap; font: inherit; font-size: 13px; padding: 5px 11px; border-radius: 7px; cursor: pointer;
  border: 1px solid var(--accent); background: var(--accent); color: var(--card); }
button.act.ghost { background: none; color: var(--accent); }
button.act:disabled { opacity: .45; cursor: default; }
.drawer { position: fixed; inset: 0 0 0 auto; width: min(640px, 100%); background: var(--card);
  border-left: 1px solid var(--line); box-shadow: -12px 0 40px rgba(0,0,0,.12); padding: 24px 26px;
  overflow: auto; transform: translateX(100%); transition: transform .2s ease; }
.drawer.open { transform: none; }
.drawer pre { white-space: pre-wrap; font: 13px/1.5 var(--mono); background: var(--paper);
  border: 1px solid var(--line); border-radius: 8px; padding: 12px; max-height: 360px; overflow: auto; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 12px 0; }
.close { float: right; background: none; border: 0; font-size: 22px; cursor: pointer; color: var(--soft); }
.note { background: var(--accent-soft); color: var(--ink); border-radius: 8px; padding: 10px 14px; font-size: 13px; }
#toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--ink);
  color: var(--paper); padding: 9px 16px; border-radius: 8px; font-size: 14px; opacity: 0; transition: opacity .2s; }
#toast.show { opacity: 1; }
.empty { padding: 30px; text-align: center; color: var(--soft); background: var(--card);
  border: 1px dashed var(--line); border-radius: 10px; }
@media (max-width: 760px) {
  header, nav, main { padding-left: 16px; padding-right: 16px; }
  .hero { grid-template-columns: 1fr 1fr; } .tile.big { grid-column: 1 / -1; }
  .hide-s { display: none; }
}
</style>
</head>
<body>
<header>
  <div class="brand">spurlos<span>your data, on your machine</span></div>
  <div class="who" id="who"></div>
</header>
<nav id="tabs">
  <button data-tab="overview" class="on">Overview</button>
  <button data-tab="orgs">Organisations</button>
  <button data-tab="requests">Requests</button>
  <button data-tab="replies">Replies</button>
</nav>
<main id="view"></main>
<aside class="drawer" id="drawer"></aside>
<div id="toast"></div>
<script>
const TOKEN = "__TOKEN__";
let view = document.getElementById("view");
const drawer = document.getElementById("drawer");
let labels = [];

const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) =>
  ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));

async function api(path, body) {
  const opts = {headers: {"X-Spurlos-Token": TOKEN}};
  if (body) {
    opts.method = "POST";
    opts.headers["Content-Type"] = "application/json";
    opts.body = JSON.stringify(body);
  }
  const res = await fetch(path, opts);
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || res.statusText);
  return data;
}

function toast(text) {
  const t = document.getElementById("toast");
  t.textContent = text; t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 2600);
}

async function act(path, body, okText) {
  try { const r = await api(path, body); toast(okText(r)); return r; }
  catch (e) { toast(e.message); return null; }
}

function deadline(r) {
  if (r.status !== "sent" || r.days_left === null) return `<span class="chip ${esc(r.status)}">${esc(r.status.replaceAll("_", " "))}</span>`;
  if (r.days_left < 0) return `<span class="chip late">overdue ${-r.days_left} d</span>`;
  return `<span class="chip">${r.days_left} d left</span>`;
}

async function overview() {
  const o = await api("/api/overview");
  labels = o.labels;
  document.getElementById("who").textContent = o.profile.name ? `${o.profile.name} · ${o.profile.email}` : "set your profile: spurlos profile --name ... --email ...";
  const s = o.statuses;
  const open = (s.sent || 0) + (s.waiting_on_you || 0);
  view.innerHTML = `
    <div class="hero">
      <div class="tile big"><div class="n">${o.organisations}</div><div class="t">organisations have your email address</div></div>
      <div class="tile"><div class="n">${o.dormant}</div><div class="t">silent for 2+ years</div></div>
      <div class="tile"><div class="n">${open}</div><div class="t">requests waiting for an answer</div></div>
      <div class="tile"><div class="n">${(s.done || 0) + (s.answered || 0)}</div><div class="t">answered or done</div></div>
    </div>
    <h2>To do</h2>
    ${o.todo.length ? `<ul class="todo">${o.todo.map((t) => `
      <li><b>${esc(t.what)}</b><code>${esc(t.command)}</code></li>`).join("")}</ul>`
      : `<div class="empty">Nothing to do right now.</div>`}
    <p class="muted" style="margin-top:22px">Read from ${o.messages} message headers. Nothing on this page leaves your computer, and it never sends mail: sending stays in the command line, where you confirm every message.</p>`;
}

async function orgs() {
  const items = await api("/api/triage");
  view.innerHTML = `
    <div class="bar">
      <input id="q" placeholder="Search organisations" style="min-width:240px">
      <select id="pri"><option value="">all priorities</option><option>high</option><option>medium</option><option>low</option></select>
    </div><div id="list"></div>`;
  const kinds = {"erasure": ["erasure"], "access": ["access"], "access+objection": ["access", "objection"]};
  const draw = () => {
    const q = document.getElementById("q").value.toLowerCase();
    const p = document.getElementById("pri").value;
    const rows = items.filter((i) => (!p || i.priority === p) && (i.name + i.domain).toLowerCase().includes(q));
    document.getElementById("list").innerHTML = rows.length ? `<table>
      <tr><th>Organisation</th><th class="hide-s">Category</th><th>Suggestion</th><th class="hide-s">Contact</th><th></th></tr>
      ${rows.map((i) => `<tr>
        <td><b>${esc(i.name)}</b><div class="muted">${esc(i.domain)} · ${i.messages} mails</div></td>
        <td class="hide-s">${esc(i.category)}</td>
        <td><span class="chip ${esc(i.priority)}">${esc(i.priority)}</span> ${esc(i.action)}<div class="muted">${esc(i.reason)}</div></td>
        <td class="hide-s muted">${esc(i.contact || "unknown")}</td>
        <td>${(kinds[i.action] || []).map((k) => {
          const has = i.requests.find((r) => r.kind === k);
          if (has) return `<span class="chip ${esc(has.status)}">${esc(k)} ${esc(has.status.replaceAll("_", " "))}</span>`;
          return `<button class="act ghost" data-domain="${esc(i.domain)}" data-kind="${k}" ${i.contact ? "" : "disabled title='no contact yet: spurlos contact DOMAIN --email ...'"}>Draft ${k}</button>`;
        }).join(" ")}</td>
      </tr>`).join("")}</table>` : `<div class="empty">No organisations match.</div>`;
  };
  view.addEventListener("input", draw);
  view.addEventListener("click", async (e) => {
    const b = e.target.closest("button[data-kind]");
    if (!b) return;
    const r = await act("/api/draft", {domain: b.dataset.domain, kind: b.dataset.kind}, (x) => `Draft ${x.id} saved`);
    if (r) { b.disabled = true; b.textContent = r.id; }
  });
  draw();
}

async function requests() {
  const rows = await api("/api/requests");
  view.innerHTML = rows.length ? `<table>
    <tr><th>Reference</th><th>Kind</th><th>Organisation</th><th>Status</th><th class="hide-s">Sent</th><th class="hide-s">Replies</th></tr>
    ${rows.map((r) => `<tr class="click" data-id="${esc(r.id)}">
      <td><code>${esc(r.id)}</code></td><td>${esc(r.kind)}${r.parent ? `<div class="muted">for ${esc(r.parent)}</div>` : ""}</td>
      <td>${esc(r.org)}<div class="muted">${esc(r.transport)}</div></td><td>${deadline(r)}</td>
      <td class="hide-s muted">${esc((r.sent || "").slice(0, 10) || "–")}</td><td class="hide-s">${r.replies}</td></tr>`).join("")}
  </table>` : `<div class="empty">No requests yet. Draft one from the Organisations tab.</div>`;
  view.querySelectorAll("tr.click").forEach((tr) => tr.addEventListener("click", () => openRequest(tr.dataset.id)));
}

async function openRequest(id) {
  const r = await api(`/api/request/${encodeURIComponent(id)}`);
  const late = r.status === "sent" && r.due && new Date(r.due) < new Date();
  drawer.innerHTML = `
    <button class="close" aria-label="Close">×</button>
    <h2 style="margin-top:0"><code>${esc(r.id)}</code> ${esc(r.kind)} · ${esc(r.org)}</h2>
    <div class="muted">to ${esc(r.recipient)} by ${esc(r.transport)} · ${esc(r.status.replaceAll("_", " "))}${r.due ? ` · due ${esc(r.due)}` : ""}</div>
    <div class="row">
      ${r.transport === "email" ? `<a class="act ghost" style="text-decoration:none;padding:5px 11px;border:1px solid var(--accent);border-radius:7px;color:var(--accent)" href="#" data-export="${esc(r.id)}">Download .eml</a>` : ""}
      ${r.status === "draft" ? `<button class="act" data-do="mark-sent">I sent it</button><button class="act ghost" data-do="delete">Delete draft</button>` : ""}
      ${late && r.kind !== "reminder" && r.kind !== "complaint" ? `<button class="act" data-do="remind">Draft reminder</button>` : ""}
      ${(late || r.status === "refused") && r.kind !== "reminder" && r.kind !== "complaint" ? `<button class="act ghost" data-do="complain">Draft complaint</button>` : ""}
    </div>
    ${r.status === "draft" && r.transport === "email" ? `<div class="note">Send it with <code>spurlos request send ${esc(r.id)}</code>, or open the .eml in your mail program and press “I sent it”.</div>` : ""}
    <h2>${esc(r.subject)}</h2><pre>${esc(r.body)}</pre>
    <h2>Replies</h2>
    ${r.replies.length ? r.replies.map((x) => `
      <div class="tile" style="margin-bottom:10px">
        <div class="row" style="margin:0 0 6px"><span class="chip ${["confirmed","no_data","data_provided"].includes(x.label) ? "ok" : x.label === "refused" ? "refused" : ""}">${esc(x.label)}</span>
        <span class="muted">${esc((x.date || "").slice(0, 10))} · ${esc(x.sender)} · by ${esc(x.source)}</span></div>
        ${x.summary ? `<div>${esc(x.summary)}</div>` : ""}
        <div class="muted">next: ${esc(x.next_step || "–")}</div>
        <pre>${esc(x.body)}</pre>
        <div class="row">Wrong label? <select data-key="${esc(x.key)}">${labels.map((l) => `<option ${l === x.label ? "selected" : ""}>${l}</option>`).join("")}</select></div>
      </div>`).join("") : `<div class="muted">No replies yet.</div>`}`;
  drawer.classList.add("open");
  drawer.querySelector(".close").onclick = () => drawer.classList.remove("open");
  drawer.querySelectorAll("[data-do]").forEach((b) => b.onclick = async () => {
    const what = b.dataset.do;
    const body = {id: r.id};
    if (what === "complain" && r.status === "refused") body.why = prompt("Why does their reason not hold? (optional)") || "";
    const done = await act(`/api/${what}`, body, (x) => x.id ? `Draft ${x.id} saved` : x.due ? `Answer due by ${x.due}` : "Done");
    if (done) { drawer.classList.remove("open"); show("requests"); }
  });
  drawer.querySelectorAll("[data-export]").forEach((a) => a.onclick = async (e) => {
    e.preventDefault();
    const res = await fetch(`/api/export/${encodeURIComponent(a.dataset.export)}`, {headers: {"X-Spurlos-Token": TOKEN}});
    const url = URL.createObjectURL(await res.blob());
    const link = document.createElement("a");
    link.href = url; link.download = `${a.dataset.export}.eml`; link.click();
    URL.revokeObjectURL(url);
  });
  drawer.querySelectorAll("select[data-key]").forEach((s) => s.onchange = async () => {
    const done = await act("/api/relabel", {key: s.dataset.key, label: s.value}, (x) => `Saved. Next: ${x.next || "–"}`);
    if (done) openRequest(r.id);
  });
}

async function replies() {
  const rows = await api("/api/replies");
  view.innerHTML = rows.length ? `<table>
    <tr><th>Date</th><th>From</th><th>Label</th><th class="hide-s">Next step</th><th>Request</th></tr>
    ${rows.map((x) => `<tr class="click" data-id="${esc(x.request_id || "")}">
      <td class="muted">${esc((x.date || "").slice(0, 10))}</td><td>${esc(x.sender)}<div class="muted">${esc(x.subject)}</div></td>
      <td><span class="chip">${esc(x.label || "–")}</span><div class="muted">${esc(x.source || "")}</div></td>
      <td class="hide-s muted">${esc(x.next_step || "")}</td><td><code>${esc(x.request_id || "?")}</code></td></tr>`).join("")}
  </table>` : `<div class="empty">No replies yet. Run <code>spurlos replies fetch ...</code> or <code>spurlos replies import ...</code>.</div>`;
  view.querySelectorAll("tr.click").forEach((tr) => tr.addEventListener("click", () => tr.dataset.id && openRequest(tr.dataset.id)));
}

const pages = {overview, orgs, requests, replies};
async function show(tab) {
  document.querySelectorAll("#tabs button").forEach((b) => b.classList.toggle("on", b.dataset.tab === tab));
  const fresh = view.cloneNode(false);
  view.replaceWith(fresh);
  view = fresh;
  try { await pages[tab](); } catch (e) { fresh.innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
}
document.getElementById("tabs").addEventListener("click", (e) => {
  const b = e.target.closest("button[data-tab]");
  if (b) { drawer.classList.remove("open"); show(b.dataset.tab); }
});
show("overview");
</script>
</body>
</html>
